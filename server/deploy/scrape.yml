global:
  scrape_interval: 10s
  external_labels:
    monitor: "open-network-experience-cmp"

scrape_configs:
  # 1. Scrape Physical & Virtual Sensor Node Exporters
  - job_name: "sensor-node-metrics"
    scrape_interval: 10s
    http_sd_configs:
      - url: http://cmp-server:8000/api/v1/telemetry/prometheus-sd
        refresh_interval: 30s

  # 2. Scrape Blackbox ICMP / TCP Gateway Ping
  - job_name: "blackbox-gateway-ping"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    http_sd_configs:
      - url: http://cmp-server:8000/api/v1/telemetry/blackbox-sd?module=gateway
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [sensor_ip]
        target_label: __address__
        regex: (.*)
        replacement: $1:9115

  # 3. Scrape Blackbox DNS Resolvers
  - job_name: "blackbox-dns-probes"
    metrics_path: /probe
    params:
      module: [dns_udp]
    http_sd_configs:
      - url: http://cmp-server:8000/api/v1/telemetry/blackbox-sd?module=dns
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [sensor_ip]
        target_label: __address__
        regex: (.*)
        replacement: $1:9115

  # 4. Scrape Blackbox Core K-12 SaaS & State Testing Apps
  - job_name: "blackbox-saas-apps"
    metrics_path: /probe
    params:
      module: [http_2xx]
    http_sd_configs:
      - url: http://cmp-server:8000/api/v1/telemetry/blackbox-sd?module=saas
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [sensor_ip]
        target_label: __address__
        regex: (.*)
        replacement: $1:9115
