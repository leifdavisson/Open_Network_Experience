global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'site', 'sensor_id']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'

receivers:
- name: 'default-receiver'
