global:
  resolve_timeout: 5m
  # Optional SMTP configuration for email alerts
  # smtp_smarthost: 'smtp.office365.com:587'
  # smtp_from: 'openux-alerts@district.edu'
  # smtp_auth_username: 'openux-alerts@district.edu'
  # smtp_auth_password: 'your-email-password'

route:
  group_by: ['alertname', 'site', 'campus_id', 'sensor_id']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 2h
  receiver: 'default-receiver'
  routes:
    # Critical State Testing Alerts route immediately to high-priority channel
    - match:
        alertname: CAASPPUntrustedCertificate
      receiver: 'noc-critical-channel'
      repeat_interval: 15m
    - match:
        alertname: WiFiFlappingDetected
      receiver: 'noc-rf-team'
      repeat_interval: 30m

inhibit_rules:
  # 1. ROOT CAUSE SUPPRESSION: If Campus Gateway / WAN is Down, suppress all downstream SaaS/DNS/App alerts for that campus
  - source_match:
      alertname: 'CampusGatewayDown'
      severity: 'critical'
    target_match_re:
      alertname: 'SaaSAppUnreachable|DNSResolutionFailure|CIPAInspectionFailure|WiFiSSIDMissing|CambiumPortalDown|CanvasLMSUnreachable'
    equal: ['campus_id', 'site']

  # 2. SENSOR OFFLINE SUPPRESSION: If a sensor is completely unreachable, suppress individual service/probe degradation alarms
  - source_match:
      alertname: 'SensorAgentOffline'
    target_match_re:
      alertname: '.*Probe.*|.*Jitter.*|.*Latency.*'
    equal: ['sensor_id']

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://cmp-server:8000/api/v1/alerts'
        send_resolved: true

  # Pre-configured Slack Webhook template
  - name: 'noc-critical-channel'
    webhook_configs:
      - url: 'http://cmp-server:8000/api/v1/alerts'
        send_resolved: true
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/T000/B000/XXXX'
    #     channel: '#district-noc-alerts'
    #     title: '[CRITICAL] {{ .GroupLabels.alertname }} - {{ .CommonLabels.site }}'
    #     text: '{{ .CommonAnnotations.description }}'
    #     send_resolved: true

  # Pre-configured MS Teams / Webhook template
  - name: 'noc-rf-team'
    webhook_configs:
      - url: 'http://cmp-server:8000/api/v1/alerts'
        send_resolved: true
