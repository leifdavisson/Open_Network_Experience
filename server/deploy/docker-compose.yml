version: '3.8'
services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
    - 443:443
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - ./certs:/etc/caddy/certs:ro
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    networks:
    - cmp_backend
  cmp-server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: open-ux/cmp-server:latest
    container_name: cmp-server
    restart: always
    expose:
    - '8000'
    environment:
    - PYTHONUNBUFFERED=1
    - DB_PATH=/app/data/cmp.db
    - BACKUP_DIR=/app/data/backups
    - CMP_HOST=${CMP_HOST:-cmp-server}
    - CMP_PORT=${CMP_PORT:-8000}
    - ADMIN_API_KEY=${ADMIN_API_KEY:-admin-noc-key-change-me}
    - SSH_USER=${SSH_USER:-sensor}
    - SSH_PASS=${SSH_PASS:-}
    volumes:
    - cmp-data:/app/data
    - ../../server:/app/server
    - ../../sensor:/app/sensor
    - ../../chromebook-sensor:/app/chromebook-sensor
    command:
    - python
    - -m
    - uvicorn
    - server.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --reload
    cap_drop:
    - ALL
    networks:
    - cmp_backend
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: victoriametrics
    restart: always
    expose:
    - '8428'
    volumes:
    - vm-data:/victoria-metrics-data
    - ./scrape.yml:/etc/prometheus/scrape.yml:ro
    command:
    - -retentionPeriod=13
    - -promscrape.config=/etc/prometheus/scrape.yml
    - -promscrape.config.strictParse=false
    cap_drop:
    - ALL
    networks:
    - cmp_backend
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    user: root
    restart: always
    expose:
    - '3100'
    volumes:
    - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    - loki-data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
    - cmp_backend
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: always
    expose:
    - '9093'
    volumes:
    - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - am-data:/alertmanager
    command: --config.file=/etc/alertmanager/alertmanager.yml
    cap_drop:
    - ALL
    networks:
    - cmp_backend
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: always
    expose:
    - '3000'
    environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=admin-noc-password-change-me
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_SECURITY_ALLOW_EMBEDDING=true
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
    - GF_SECURITY_COOKIE_SAMESITE=none
    - GF_SECURITY_COOKIE_SECURE=true
    - GF_SERVER_DOMAIN=localhost
    - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
    - GF_SERVER_SERVE_FROM_SUB_PATH=true
    - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
    - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
    - ./dashboards:/var/lib/grafana/dashboards:ro
    - grafana-data:/var/lib/grafana
    cap_drop:
    - ALL
    networks:
    - cmp_backend
  iperf3:
    image: networkstatic/iperf3:latest
    container_name: iperf3-server
    restart: always
    ports:
    - 5201:5201/tcp
    - 5201:5201/udp
    command: -s
    networks:
    - cmp_backend
volumes:
  cmp-data: null
  vm-data: null
  loki-data: null
  am-data: null
  grafana-data: null
networks:
  cmp_backend:
    driver: bridge
