<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>

    <!-- Cyan to Indigo Gradient -->
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Emerald Pulse Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />

  <!-- Outer Concentric Wi-Fi Radar Arcs -->
  <path d="M 120 180 A 180 180 0 0 1 392 180" fill="none" stroke="#00F0FF" stroke-width="12" stroke-linecap="round" opacity="0.25" />
  <path d="M 156 215 A 135 135 0 0 1 356 215" fill="none" stroke="#00F0FF" stroke-width="14" stroke-linecap="round" opacity="0.55" />
  <path d="M 194 252 A 90 90 0 0 1 318 252" fill="none" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />

  <!-- Central Hexagonal Core Shield -->
  <polygon points="256,220 320,256 320,330 256,368 192,330 192,256" fill="url(#cyanIndigo)" opacity="0.18" stroke="url(#cyanIndigo)" stroke-width="10" stroke-linejoin="round" />

  <!-- Center Beacon Pulse -->
  <circle cx="256" cy="294" r="24" fill="url(#cyanIndigo)" filter="url(#glow)" />
  <circle cx="256" cy="294" r="10" fill="#FFFFFF" />

  <!-- Radiating Metric Pulse Line (Heartbeat / Telemetry EKG) -->
  <path d="M 128 400 L 192 400 L 220 360 L 244 430 L 268 380 L 292 410 L 320 400 L 384 400" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Orbiting Node Dots -->
  <circle cx="192" cy="256" r="8" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="320" cy="256" r="8" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="320" cy="330" r="8" fill="#818CF8" filter="url(#glow)" />
  <circle cx="192" cy="330" r="8" fill="#818CF8" filter="url(#glow)" />
  <circle cx="256" cy="368" r="8" fill="#34D399" filter="url(#glow)" />
  <circle cx="256" cy="220" r="8" fill="#00F0FF" filter="url(#glow)" />

  <!-- Interconnect Lines -->
  <line x1="256" y1="220" x2="256" y2="294" stroke="#00F0FF" stroke-width="4" stroke-dasharray="4,4" opacity="0.8" />
  <line x1="192" y1="256" x2="256" y2="294" stroke="#00F0FF" stroke-width="4" opacity="0.7" />
  <line x1="320" y1="256" x2="256" y2="294" stroke="#00F0FF" stroke-width="4" opacity="0.7" />
  <line x1="256" y1="294" x2="256" y2="368" stroke="#34D399" stroke-width="4" opacity="0.7" />
</svg>
