  <!-- Connection Links -->
  <path d="M 320 280 L 360 280" stroke="#00F0FF" stroke-width="3" stroke-dasharray="4,4"/>
  <path d="M 640 280 L 680 280" stroke="#10B981" stroke-width="3"/>
</svg>
