    <text x="25" y="350" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">• Alertmanager Multi-Channel Sinks</text>
    <text x="25" y="368" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">• Slack / Discord / Webhook Dispatches</text>
