<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="boxDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="900" height="500" rx="16" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>

  <!-- Title Header -->
  <text x="450" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#F8FAFC" letter-spacing="1">
    DUAL-NIC "SCIENTIFIC CONTROL" ROOT-CAUSE ISOLATION
  </text>
  <text x="450" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">
    How ONE instantly isolates RF Wireless degradation from upstream Switch, Firewall, or ISP outages
  </text>

  <!-- Left: ONE Edge Prober Sensor -->
  <g transform="translate(40, 110)">
    <rect width="220" height="340" rx="16" fill="url(#boxDark)" stroke="#38BDF8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="20" y="20" width="180" height="36" rx="8" fill="#1E293B" stroke="#00F0FF" stroke-width="1"/>
    <text x="110" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#00F0FF">ONE EDGE SENSOR</text>

    <!-- Eth0 Node -->
    <rect x="20" y="80" width="180" height="90" rx="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <text x="35" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#34D399">NIC 1: Wired (eth0)</text>
    <text x="35" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Scientific Baseline Control</text>
    <text x="35" y="145" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">RTT: 2.1ms | Loss: 0.0%</text>
    <circle cx="180" cy="102" r="5" fill="#10B981"/>

    <!-- Wlan0 Node -->
    <rect x="20" y="200" width="180" height="90" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="35" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#38BDF8">NIC 2: Wi-Fi (wlan0)</text>
    <text x="35" y="245" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">RF User Experience Prober</text>
    <text x="35" y="265" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">RTT: 48.4ms | Loss: 4.2%</text>
    <circle cx="180" cy="222" r="5" fill="#38BDF8"/>
  </g>

  <!-- Mid: Differential Decision Engine -->
  <g transform="translate(310, 110)">
    <rect width="280" height="340" rx="16" fill="url(#boxDark)" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#A5B4FC">DIFFERENTIAL ANALYZER</text>

    <!-- Condition 1: RF Failure -->
    <rect x="15" y="70" width="250" height="110" rx="8" fill="#111827" stroke="#F43F5E" stroke-width="1"/>
    <text x="25" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#F43F5E">SCENARIO A: Local RF Issue</text>
    <text x="25" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">eth0 = FAST | wlan0 = SLOW / LOSS</text>
    <text x="25" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">Root Cause:</text>
    <text x="25" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Co-channel interference / AP Overload</text>

    <!-- Condition 2: Upstream Outage -->
    <rect x="15" y="200" width="250" height="110" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1"/>
    <text x="25" y="222" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#F59E0B">SCENARIO B: Upstream Outage</text>
    <text x="25" y="242" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">eth0 = DOWN | wlan0 = DOWN</text>
    <text x="25" y="262" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#F59E0B">Root Cause:</text>
    <text x="25" y="282" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Switch trunk / Core Router / WAN ISP</text>
  </g>

  <!-- Right: Automated NOC Alert & PCAP -->
  <g transform="translate(640, 110)">
    <rect width="220" height="340" rx="16" fill="url(#boxDark)" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <text x="110" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#34D399">ZERO-DELAY ACTION</text>

    <g transform="translate(15, 75)">
      <rect width="190" height="60" rx="8" fill="#111827" stroke="#334155"/>
      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">50MB RAM PCAP Ring</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Freezes packet capture evidence</text>
    </g>

    <g transform="translate(15, 150)">
      <rect width="190" height="60" rx="8" fill="#111827" stroke="#334155"/>
      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34D399">NOC Wallboard Pin</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Interactive campus map color shift</text>
    </g>

    <g transform="translate(15, 225)">
      <rect width="190" height="60" rx="8" fill="#111827" stroke="#334155"/>
      <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#A78BFA">Webhook / Email Alert</text>
      <text x="15" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Direct notification to Sysadmin</text>
    </g>
  </g>

  <!-- Flow Arrows -->
  <path d="M 260 235 L 310 235" stroke="#00F0FF" stroke-width="3" stroke-dasharray="4,4"/>
  <path d="M 590 235 L 640 235" stroke="#10B981" stroke-width="3"/>
</svg>
