<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Cyan to Indigo Gradient -->
    <linearGradient id="cyanIndigoLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Emerald Pulse Gradient -->
    <linearGradient id="emeraldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="1000" height="240" rx="28" fill="url(#lightBg)" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Logo Mark (Left) -->
  <g transform="translate(40, 20) scale(0.39)">
    <!-- Outer Arcs -->
    <path d="M 120 180 A 180 180 0 0 1 392 180" fill="none" stroke="#0284C7" stroke-width="12" stroke-linecap="round" opacity="0.35" />
    <path d="M 156 215 A 135 135 0 0 1 356 215" fill="none" stroke="#0284C7" stroke-width="14" stroke-linecap="round" opacity="0.65" />
    <path d="M 194 252 A 90 90 0 0 1 318 252" fill="none" stroke="#0284C7" stroke-width="16" stroke-linecap="round" />

    <!-- Hex Core Shield -->
    <polygon points="256,220 320,256 320,330 256,368 192,330 192,256" fill="url(#cyanIndigoLight)" opacity="0.1" stroke="url(#cyanIndigoLight)" stroke-width="10" stroke-linejoin="round" />

    <!-- Center Pulse -->
    <circle cx="256" cy="294" r="24" fill="url(#cyanIndigoLight)" />
    <circle cx="256" cy="294" r="10" fill="#FFFFFF" />

    <!-- Telemetry Pulse Line -->
    <path d="M 128 400 L 192 400 L 220 360 L 244 430 L 268 380 L 292 410 L 320 400 L 384 400" fill="none" stroke="url(#emeraldGradLight)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Orbiting Nodes -->
    <circle cx="192" cy="256" r="8" fill="#0284C7" />
    <circle cx="320" cy="256" r="8" fill="#0284C7" />
    <circle cx="320" cy="330" r="8" fill="#6366F1" />
    <circle cx="192" cy="330" r="8" fill="#6366F1" />
    <circle cx="256" cy="368" r="8" fill="#059669" />
    <circle cx="256" cy="220" r="8" fill="#0284C7" />

    <!-- Interconnects -->
    <line x1="256" y1="220" x2="256" y2="294" stroke="#0284C7" stroke-width="4" stroke-dasharray="4,4" opacity="0.8" />
    <line x1="192" y1="256" x2="256" y2="294" stroke="#0284C7" stroke-width="4" opacity="0.7" />
    <line x1="320" y1="256" x2="256" y2="294" stroke="#0284C7" stroke-width="4" opacity="0.7" />
    <line x1="256" y1="294" x2="256" y2="368" stroke="#059669" stroke-width="4" opacity="0.7" />
  </g>

  <!-- Typography / Brand Name -->
  <g transform="translate(260, 110)">
    <!-- Primary Title -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5" fill="#0F172A">
      OPEN <tspan fill="url(#cyanIndigoLight)">NETWORK</tspan> EXPERIENCE
    </text>
    <!-- Acronym & Tagline -->
    <text x="4" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#0284C7">
      ONE PLATFORM
      <tspan fill="#CBD5E1" font-weight="400" letter-spacing="1"> | </tspan>
      <tspan fill="#475569" font-weight="500" letter-spacing="1.5">OPEN SOURCE SYNTHETIC UXI &amp; FLEET MONITORING</tspan>
    </text>
  </g>

  <!-- Status / Release Pill -->
  <g transform="translate(860, 42)">
    <rect width="90" height="28" rx="14" fill="#F1F5F9" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="16" cy="14" r="5" fill="#10B981" />
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#0F172A" letter-spacing="1">v0.4.0</text>
  </g>
</svg>
