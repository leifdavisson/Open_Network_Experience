name: CI — Lint, Typecheck, V&V & Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Syntax, Mypy & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install mypy pylint pytest pytest-cov hypothesis bandit httpx

      - name: Compile all Python files (syntax check)
        run: |
          python -m compileall -q server sensor scripts

      - name: Static Type Checking with Mypy
        run: |
          mypy server sensor --exclude 'sensor/playwright-runner' --explicit-package-bases --ignore-missing-imports

      - name: Security SAST Scan with Bandit
        run: |
          bandit -r server/ sensor/ -ll

      - name: Validate shell scripts
        run: |
          bash -n sensor/install.sh
          bash -n sensor/playwright-runner/entrypoint.sh

  vv-test-suite:
    name: Pytest, MC/DC & RTM Traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest pytest-cov hypothesis httpx

      - name: Run Full Pytest Suite (310 Tests)
        run: |
          pytest --cov=server --cov=sensor --cov-report=term-missing

      - name: Verify DO-178C Level A MC/DC Truth Tables
        run: |
          python scripts/verify_mcdc.py

      - name: Audit AST Requirements Traceability Matrix (RTM)
        run: |
          python scripts/generate_rtm.py

  chromebook-extension:
    name: Chromebook Extension Telemetry Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Chromebook Extension Suite (16 Tests)
        run: |
          cd chromebook-sensor
          npm test

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CMP Server Image
        run: docker build -f server/Dockerfile -t open-ux/cmp-server:ci-test .

      - name: Build Playwright Runner Image
        run: docker build -t open-ux/playwright-runner:ci-test sensor/playwright-runner/

  integration-test:
    name: Live Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install server dependencies
        run: pip install -r server/requirements.txt

      - name: Start CMP Server Stack
        run: |
          docker compose -f server/deploy/docker-compose.yml up --build -d
          echo "Waiting for services to start..."
          sleep 10
          curl --retry 5 --retry-delay 2 --retry-connrefused -s http://localhost:8000/docs > /dev/null

      - name: Run Integration & Web UI Test Suites
        run: |
          python server/test_integration.py
          python server/test_ui_comprehensive.py

      - name: Tear down stack
        if: always()
        run: docker compose -f server/deploy/docker-compose.yml down -v

  validate-configs:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install YAML parser
        run: pip install pyyaml

      - name: Validate YAML configs
        run: |
          python -c "import yaml; yaml.safe_load(open('sensor/blackbox.yml'))"
          python -c "import yaml; yaml.safe_load(open('sensor/prometheus-agent.yml'))"
          python -c "import yaml; yaml.safe_load(open('server/deploy/alertmanager.yml'))"
          python -c "import yaml; yaml.safe_load(open('server/deploy/loki-config.yaml'))"
          python -c "import yaml; yaml.safe_load(open('server/deploy/grafana-datasources.yaml'))"
          python -c "import yaml; yaml.safe_load(open('server/deploy/grafana-dashboards.yaml'))"

      - name: Validate JSON configs
        run: |
          python -c "import json; json.load(open('sensor/reconciler/reconciler.json.example'))"
          python -c "import json; json.load(open('server/deploy/dashboards/noc_dashboard.json'))"

      - name: Validate Docker Compose
        run: docker compose -f server/deploy/docker-compose.yml config > /dev/null
