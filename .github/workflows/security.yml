name: Security — Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

jobs:
  pip-audit:
    name: Python Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit server dependencies
        run: |
          pip install -r server/requirements.txt
          pip-audit -r server/requirements.txt

  docker-scan:
    name: Docker Image Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CMP Server Image
        run: docker build -t open-ux/cmp-server:scan server/

      - name: Scan CMP Server Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'open-ux/cmp-server:scan'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  secrets-scan:
    name: Hardcoded Secrets Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
