name: Security — Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

jobs:
  pip-audit:
    name: Python Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit server dependencies
        run: |
          pip install -r server/requirements.txt
          pip-audit -r server/requirements.txt

  docker-scan:
    name: Docker Image Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CMP Server Image
        run: docker build -f server/Dockerfile -t open-ux/cmp-server:scan .

      - name: Install Trivy Scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan CMP Server Image with Trivy
        run: |
          trivy image --severity CRITICAL,HIGH --exit-code 0 open-ux/cmp-server:scan

  secrets-scan:
    name: Hardcoded Secrets Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Scan with Gitleaks
        run: |
          gitleaks detect --config .gitleaks.toml --verbose --redact
