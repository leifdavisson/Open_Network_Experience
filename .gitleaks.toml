# Gitleaks Configuration & Allowlist
# Configures Gitleaks to ignore public test tokens, documentation examples, and unit test keys.

[extend]
# Inherits default Gitleaks secret detection rules

[allowlist]
description = "Allowlist for public test verification tokens and benign doc placeholders"
paths = [
    '''Open-Source Aruba UXI Alternative\.docx''',
    '''sensor/cipa_compliance\.py''',
    '''GETTING_STARTED\.md''',
    '''README\.md''',
    '''sensor/README\.md''',
    '''server/README\.md''',
    '''server/main\.py''',
    '''server/test_integration\.py'''
]
regexes = [
    '''admin-noc-key-change-me''',
    '''sensor-edge-key-change-me''',
    '''sensor-key-''',
    '''nowifiyet''',
