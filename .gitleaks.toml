# ==============================================================================
# Open Network Experience (ONE) - Gitleaks Secret Detection Configuration
# ==============================================================================

[extend]
# Inherits standard Gitleaks secret detection rule suite

# ------------------------------------------------------------------------------
# Custom Project Rules: Specific to ONE Architecture & Credential Formats
# ------------------------------------------------------------------------------
[[rules]]
id = "one-sensor-api-key"
description = "Detected Open Network Experience (ONE) Sensor API Key"
regex = '''sensor-key-[0-9a-f]{32}'''
keywords = ["sensor-key-"]

[[rules]]
id = "hardcoded-plaintext-password"
description = "Detected hardcoded plaintext password variable assignment"
regex = '''(?i)(?:password|passwd|pwd)\s*=\s*['"][^'"]{6,}['"]'''
keywords = ["password", "passwd", "pwd"]

# ------------------------------------------------------------------------------
# Scoped Allowlists: ONLY Specific Benign Test Placeholders
# ------------------------------------------------------------------------------
[allowlist]
description = "Allowlist for public test verification tokens and benign doc placeholders"
paths = [
    '''sensor/cipa_compliance\.py''',
    '''sensor/reconciler/test_reconciler\.py''',
    '''sensor/reconciler/reconciler\.py''',
    '''docs/HELPDESK_INSTALL_GUIDE\.md''',
    '''server/schemas\.py''',
    '''GETTING_STARTED\.md''',
    '''README\.md''',
    '''sensor/README\.md''',
    '''server/README\.md''',
    '''server/main\.py''',
    '''server/test_integration\.py''',
    '''server/test_security_hardening\.py'''
]
regexes = [
    '''admin-noc-key-change-me''',
    '''sensor-edge-key-change-me''',
    '''test-noc-key''',
    '''nowifiyet''',
